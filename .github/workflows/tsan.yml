name: tsan

# Manual-dispatch only on this fork: run from the Actions tab when a change
# touches threading or memory management. Kept out of the automatic push/PR
# path to avoid turning master red on pre-existing findings unrelated to a
# given change.
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQJS_BUILD_WERROR=ON -DQJS_ENABLE_TSAN=ON
          cmake --build build -j`nproc`
      - name: test
        run: |
          git submodule update --init --checkout --depth 1
          ./build/run-test262 -m -c test262.conf -c test262-fast.conf -a
