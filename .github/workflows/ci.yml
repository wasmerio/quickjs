name: ci

# Trimmed for the wasmerio/quickjs fork. Upstream quickjs-ng runs a ~100-job
# matrix (every Windows toolchain, meson x OS x sanitizer x allocator, riscv,
# cygwin, tcc, msan, ...). This fork's only consumer is edgejs, which ships
# native builds on Linux and macOS and a WASIX build via wasmer, so we validate
# just those: Debug + Release builds and an ASAN+UBSAN + test262 pass on Linux
# and macOS. tsan/valgrind remain available via workflow_dispatch.

on:
  pull_request:
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.gitignore'
      - '!LICENSE'
      - '!README.md'
      - '!docs/**'
      - '!examples/**'
      - '.github/workflows/ci.yml'

jobs:
  ci:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.configType }})
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, configType: Debug }
          - { os: ubuntu-latest, configType: Release }
          - { os: ubuntu-latest, configType: asan+ubsan }
          - { os: macos-14, configType: Debug }
          - { os: macos-14, configType: asan+ubsan }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: uname
        run: uname -a

      - name: Set build ENV vars
        run: |
          if [ "${{ matrix.config.configType }}" = "Debug" ]; then
            echo "BUILD_TYPE=Debug" >> $GITHUB_ENV;
          elif [ "${{ matrix.config.configType }}" = "asan+ubsan" ]; then
            echo "BUILD_TYPE=RelWithDebInfo" >> $GITHUB_ENV;
            echo "QJS_ENABLE_ASAN=ON" >> $GITHUB_ENV;
            echo "QJS_ENABLE_UBSAN=ON" >> $GITHUB_ENV;
          fi

      - name: build
        run: |
          make \
            BUILD_TYPE=$BUILD_TYPE \
            QJS_ENABLE_ASAN=$QJS_ENABLE_ASAN \
            QJS_ENABLE_UBSAN=$QJS_ENABLE_UBSAN

      - name: stats
        run: |
          make stats

      - name: cxxtest
        run: |
          make cxxtest

      - name: test
        run: |
          make test

      # NOTE: the full test262 suite is intentionally not run here yet. This
      # fork's intentional divergences (e.g. removed function.lineNumber/
      # columnNumber, V8-style deferred module loading) need test262.conf to be
      # curated before the suite is green; tracked as follow-up. `make test`
      # above runs the fork's own bundled conformance tests (tests.conf).

      - name: test standalone
        run: |
          ./build/qjs -c examples/hello.js -o hello
          ./hello

      # NOTE: upstream's `./build/api-test` (C API conformance) is intentionally
      # not run here. It asserts upstream semantics this fork deliberately
      # diverges from — compile-time module resolution (this fork defers,
      # V8-style) and WTF-8 lone-surrogate encoding, among others. edgejs
      # exercises the engine through its own napi test suite instead.

      - name: test lre
        run: |
          ./build/lre-test
