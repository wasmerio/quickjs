name: valgrind

# Manual-dispatch only on this fork: run from the Actions tab when a change
# touches threading or memory management. Kept out of the automatic push/PR
# path to avoid turning master red on pre-existing findings unrelated to a
# given change.
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: install valgrind
        run: sudo apt-get update && sudo apt-get install valgrind
      - name: build
        run: |
          make BUILD_TYPE=RelWithDebInfo
      - name: test
        run: |
          git submodule update --init --checkout --depth 1
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --error-exitcode=1 ./build/run-test262 -m -c test262.conf -c test262-fast.conf -a
